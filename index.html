<!doctype html>
<html lang="ru" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Məzir — вкусные встречи</title>
    <meta name="description" content="Интерактивные iOS-макеты Məzir: рестораны, доставка и бронирование столов." />
    <script>try{var p=JSON.parse(localStorage.getItem('mazir-appearance-v1')||'{}');var theme=p.theme==='light'||p.theme==='dark'?p.theme:(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.theme=theme;document.documentElement.classList.toggle('dark',theme==='dark');document.documentElement.style.colorScheme=theme;}catch(e){}</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
